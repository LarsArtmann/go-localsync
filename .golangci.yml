version: "2"
run:
  timeout: 5m
  go: ""
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - gosec
    - nakedret
    - errorlint
    - gochecksumtype
    - err113
    - goheader
    - noctx
    - bodyclose
    - nonamedreturns
    - nestif
    - tagalign
    - unparam
    - intrange
    - forbidigo
    - importas
    - dogsled
    - inamedparam
    - goprintffuncname
    - whitespace
    - arangolint
    - perfsprint
    - nlreturn
    - nilnil
    - errname
    - exhaustruct
    - misspell
    - tagliatelle
    - wrapcheck
    - errcheck
    - contextcheck
    - nolintlint
    - gocritic
    - predeclared
    - usestdlibvars
    - wsl_v5
    - loggercheck
    - prealloc
    - spancheck
    - revive
    - ineffassign
    - mnd
    - mirror
    - wastedassign
    - noinlineerr
    - zerologlint
    - containedctx
    - interfacebloat
    - durationcheck
    - funcorder
    - exptostd
    - musttag
    - ireturn
    - godox
    - unused
    - testpackage
    - staticcheck
    - unconvert
    - gomodguard
    - copyloopvar
    - recvcheck
    - bidichk
    - rowserrcheck
    - testableexamples
    - sqlclosecheck
    - canonicalheader
    - varnamelen
    - gocognit
    - gochecknoglobals
    - gocyclo
    - reassign
    - exhaustive
    - iface
    - gomoddirectives
    - errchkjson
    - asasalint
    - cyclop
    - protogetter
    - nilnesserr
    - gocheckcompilerdirectives
    - dupl
    - dupword
    - decorder
    - ginkgolinter
    - fatcontext
    - usetesting
    - nilerr
    - embeddedstructfieldcheck
    - tparallel
    - paralleltest
    - maintidx
    - goconst
    - asciicheck
    - sloglint
    - godot
    - grouper
    - iotamixing
    - testifylint
    - modernize
    - promlinter
    - nosprintfhostport
    - unqueryvet
    - gosmopolitan
    - godoclint
    - gochecknoinits
    - forcetypeassert
    - thelper
    - depguard
    - govet
    - makezero
    - funlen
  settings:
    depguard:
      rules:
        Main:
          list-mode: lax
          deny:
            - pkg: "log"
              desc: "use github.com/charmbracelet/log"
    exhaustruct:
      exclude:
        - 'net/http\.Client'
        - 'net/http\.Transport'
        - 'github\.com/google/go-github/v69/github\.'
        - 'github\.com/larsartmann/go-localsync/pkg/provider\.'
        - 'github\.com/larsartmann/go-localsync/pkg/sync\.'
        - 'github\.com/larsartmann/go-localsync/internal/db\.'
        - 'database/sql\.Null'
        - 'golang\.org/x/oauth2\.Token'
    varnamelen:
      min-name-length: 2
      ignore-names:
        - id
        - db
        - tx
        - w
        - r
        - e
        - fn
        - u
        - t
        - p
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 35
    wrapcheck:
      ignore-sig-regexps:
        - 'github\.com/larsartmann/go-localsync'
        - '\.Err\(\) error$'
        - 'encoding/json\.Marshal'
        - 'database/sql\.'
        - '\.Close\(\) error$'
      ignore-package-globs:
        - github.com/larsartmann/go-localsync/pkg/errors
        - github.com/cockroachdb/errors
    mnd:
      ignored-numbers:
        - "100"
        - "10"
        - "15"
        - "3"
        - "30"
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: var-naming
          disabled: true
        - name: package-comments
          disabled: true
        - name: blank-imports
          disabled: true
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - exhaustruct
          - paralleltest
          - testpackage
          - err113
          - varnamelen
          - wrapcheck
          - gocognit
          - cyclop
          - gocritic
          - wsl_v5
          - golines
          - containedctx
          - funlen
          - dupl
          - intrange
          - modernize
          - newexpr
          - nlreturn
          - testifylint
          - unparam
          - unused
      - path: "cmd/examples/"
        linters:
          - forbidigo
          - cyclop
          - gochecknoglobals
          - mnd
          - funlen
          - gosec
          - gocritic
          - noinlineerr
          - wrapcheck
      - path: 'internal/database/connection\.go'
        linters:
          - gochecknoglobals
          - wrapcheck
          - noinlineerr
      - path: 'pkg/errors/errors\.go'
        linters:
          - wrapcheck
      - path: 'pkg/provider/provider\.go'
        linters:
          - gochecknoglobals
          - mnd
      - path: 'pkg/types/ids\.go'
        linters:
          - revive
      - path: 'pkg/providers/github/client\.go'
        linters:
          - wrapcheck
          - noinlineerr
          - mnd
          - golines
          - errorlint
      - path: 'pkg/storage/sqlite\.go'
        linters:
          - wrapcheck
          - golines
      - path: 'pkg/storage/sqlite_test\.go'
        linters:
          - funlen
      - path: 'pkg/sync/sync\.go'
        linters:
          - wrapcheck
          - golines
          - funlen
    paths:
      - "go.mod"
formatters:
  enable:
    - golines
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
