version: "2"
run:
  timeout: 5m
  go: 1.26.1
  build-tags:
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - funcorder
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        Main:
          deny:
            - desc: use github.com/charmbracelet/log
              pkg: log
          list-mode: lax
    exhaustruct:
      exclude:
        - net/http\.Client
        - net/http\.Transport
        - github\.com/google/go-github/v69/github\.
        - github\.com/larsartmann/go-localsync/pkg/provider\.
        - github\.com/larsartmann/go-localsync/pkg/sync\.
        - github\.com/larsartmann/go-localsync/internal/db\.
        - database/sql\.Null
        - golang\.org/x/oauth2\.Token
    gocognit:
      min-complexity: 35
    mnd:
      ignored-numbers:
        - "100"
        - "10"
        - "15"
        - "3"
        - "30"
    revive:
      rules:
        - disabled: true
          name: unused-parameter
        - disabled: true
          name: var-naming
        - disabled: true
          name: package-comments
        - disabled: true
          name: blank-imports
    varnamelen:
      ignore-names:
        - id
        - db
        - tx
        - w
        - r
        - e
        - fn
        - u
        - t
        - p
      min-name-length: 2
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-localsync/pkg/errors
        - github.com/cockroachdb/errors
      ignore-sig-regexps:
        - github\.com/larsartmann/go-localsync
        - \.Err\(\) error$
        - encoding/json\.Marshal
        - database/sql\.
        - \.Close\(\) error$
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - exhaustruct
          - paralleltest
          - testpackage
          - err113
          - varnamelen
          - wrapcheck
          - gocognit
          - cyclop
          - gocritic
          - wsl_v5
          - golines
          - containedctx
          - funlen
          - dupl
          - intrange
          - modernize
          - newexpr
          - nlreturn
          - testifylint
          - unparam
          - unused
          - forcetypeassert
          - gochecknoglobals
      - path: cmd/examples/
        linters:
          - forbidigo
          - cyclop
          - gochecknoglobals
          - mnd
          - funlen
          - gosec
          - gocritic
          - noinlineerr
          - wrapcheck
      - path: internal/database/connection\.go
        linters:
          - gochecknoglobals
          - wrapcheck
          - noinlineerr
      - path: pkg/errors/errors\.go
        linters:
          - wrapcheck
      - path: pkg/provider/provider\.go
        linters:
          - gochecknoglobals
          - mnd
      - path: pkg/types/ids\.go
        linters:
          - revive
      - path: pkg/providers/github/client\.go
        linters:
          - wrapcheck
          - noinlineerr
          - mnd
          - golines
          - errorlint
      - path: pkg/storage/sqlite\.go
        linters:
          - wrapcheck
          - golines
      - path: pkg/storage/sqlite_test\.go
        linters:
          - funlen
      - path: pkg/sync/sync\.go
        linters:
          - wrapcheck
          - golines
          - funlen
      - path: pkg/testhelpers/
        linters:
          - exhaustruct
          - err113
          - godoclint
          - gocritic
          - gochecknoglobals
          - gocheckcompilerdirectives
          - forcetypeassert
          - inamedparam
    paths:
      - go.mod
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
issues: {}
