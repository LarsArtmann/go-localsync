version: "2"
run:
  timeout: 5m
  go: ""
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - nakedret
    - zerologlint
    - ireturn
    - perfsprint
    - intrange
    - ginkgolinter
    - nosprintfhostport
    - godot
    - asasalint
    - grouper
    - cyclop
    - gochecknoinits
    - iotamixing
    - errorlint
    - nlreturn
    - copyloopvar
    - prealloc
    - gocognit
    - gochecksumtype
    - spancheck
    - recvcheck
    - containedctx
    - nilnil
    - errname
    - embeddedstructfieldcheck
    - unqueryvet
    - errcheck
    - forbidigo
    - bodyclose
    - interfacebloat
    - revive
    - forcetypeassert
    - thelper
    - importas
    - exhaustruct
    - dogsled
    - inamedparam
    - protogetter
    - nilnesserr
    - nonamedreturns
    - tparallel
    - err113
    - testifylint
    - gosmopolitan
    - goprintffuncname
    - depguard
    - bidichk
    - contextcheck
    - govet
    - godox
    - misspell
    - nestif
    - tagliatelle
    - nolintlint
    - wrapcheck
    - gochecknoglobals
    - gocheckcompilerdirectives
    - unused
    - gocritic
    - dupl
    - paralleltest
    - predeclared
    - ineffassign
    - testpackage
    - dupword
    - maintidx
    - staticcheck
    - gocyclo
    - mnd
    - durationcheck
    - goheader
    - unconvert
    - fatcontext
    - reassign
    - goconst
    - whitespace
    - asciicheck
    - modernize
    - mirror
    - funcorder
    - exhaustive
    - arangolint
    - wastedassign
    - rowserrcheck
    - promlinter
    - testableexamples
    - makezero
    - godoclint
    - decorder
    - sqlclosecheck
    - usestdlibvars
    - funlen
    - noinlineerr
    - wsl_v5
    - tagalign
    - gomodguard
    - canonicalheader
    - varnamelen
    - iface
    - gomoddirectives
    - exptostd
    - unparam
    - usetesting
formatters:
  enable:
    - golines
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
