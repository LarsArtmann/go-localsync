version: "2"
run:
  timeout: 5m
  go: 1.26.7
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
    - noinlineerr
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct:
      exclude:
        - net/http\.Client
        - net/http\.Transport
        - net/http\.Server
        - github\.com/google/go-github/v69/github\.
        - database/sql\.Null
        - golang\.org/x/oauth2\.Token
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-numbers:
        - "100"
        - "10"
        - "15"
        - "3"
        - "30"
    revive:
      rules:
        - disabled: true
          name: unused-parameter
        - disabled: true
          name: var-naming
        - disabled: true
          name: package-comments
        - disabled: true
          name: blank-imports
    staticcheck:
      checks:
        - all
        - -SA5012
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-names:
        - id
        - db
        - tx
        - w
        - r
        - e
        - fn
        - u
        - t
        - p
      min-name-length: 2
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-localsync/pkg/errors
      ignore-sig-regexps:
        - github\.com/larsartmann/go-localsync
        - \.Err\(\) error$
        - encoding/json\.Marshal
        - database/sql\.
        - \.Close\(\) error$
  exclusions:
    generated: lax
    rules:
      - text: (ItemFilter|FetchConfig|FetchResult|RateLimitCache|model\.Item|model\.Tombstone|sync\.SyncResult|sync\.Syncer|cqrs\.Projector|cqrs\.ItemSyncedPayload|sql\.NullTime|cqrslint\.Finding) is missing
        linters:
          - exhaustruct
      - path: _test\.go
        linters:
          - exhaustruct
          - goconst
          - paralleltest
          - testpackage
          - err113
          - varnamelen
          - wrapcheck
          - gocognit
          - cyclop
          - gocritic
          - wsl_v5
          - golines
          - containedctx
          - funlen
          - dupl
          - intrange
          - modernize
          - newexpr
          - nlreturn
          - testifylint
          - unparam
          - unused
          - forcetypeassert
          - gochecknoglobals
      - path: cmd/examples/
        linters:
          - forbidigo
          - cyclop
          - gochecknoglobals
          - mnd
          - funlen
          - gosec
          - gocritic
          - noinlineerr
          - wrapcheck
      - path: cmd/cqrs-lint/
        linters:
          - forbidigo
          - errcheck
          - cyclop
          - gochecknoglobals
          - mnd
          - funlen
          - gosec
          - gocritic
          - noinlineerr
          - wrapcheck
          - wsl_v5
          - nlreturn
      - path: pkg/cqrs/
        linters:
          - wrapcheck
          - noinlineerr
          - funlen
          - gosec
      - path: internal/cqrslint/
        linters:
          - wrapcheck
          - noinlineerr
          - funlen
          - gocognit
          - cyclop
          - gocritic
          - wsl_v5
          - nlreturn
          - varnamelen
          - mnd
      - path: cmd/cqrs-lint/
        linters:
          - wrapcheck
          - noinlineerr
          - funlen
          - gocognit
          - cyclop
          - gocritic
          - wsl_v5
          - nlreturn
          - varnamelen
          - mnd
      - path: pkg/errors/errors\.go
        linters:
          - wrapcheck
      - path: pkg/provider/provider\.go
        linters:
          - gochecknoglobals
          - mnd
      - path: pkg/types/ids\.go
        linters:
          - revive
      - path: pkg/providers/github/client\.go
        linters:
          - wrapcheck
          - noinlineerr
          - mnd
          - golines
          - errorlint
          - funlen
      - path: pkg/sync/conflict_aware\.go
        linters:
          - exhaustruct
      - path: pkg/sync/sync\.go
        linters:
          - wrapcheck
          - golines
          - funlen
      - path: pkg/testhelpers/
        linters:
          - exhaustruct
          - err113
          - godoclint
          - gocritic
          - gochecknoglobals
          - gocheckcompilerdirectives
          - forcetypeassert
          - inamedparam
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - go.mod
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
    - swaggo
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
      - vendor/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
