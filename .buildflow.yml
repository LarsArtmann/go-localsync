# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow
# Local machines cannot build aarch64-darwin derivations (no darwin builder),
# so BuildFlow's nix steps that evaluate EVERY flake check system fail with
# platform-mismatch errors unrelated to code health. nix-flake-check (current
# system) stays enabled and remains the gate.
skip_steps:
  - nix-hash-fix
  - nix-build
  - nix-build-verify
