# BuildFlow Configuration
# See: https://github.com/larsartmann/buildflow

# Build mode: full, fast, ci, dev, pre-commit
build_mode: full

# Concurrency
max_concurrency: 4

# File settings
max_file_size: 350 # lines
dupl_threshold: 30 # tokens

# TODO pattern minimum severity: info, warning, error, critical
# info = all patterns, warning = skip TODO/NOTE/OPTIMIZE, error = only FIXME/XXX/BUG, critical = BUG only
todo_min_severity: info

# Patterns to exclude from checks
exclude:
  - vendor
  - .git
  - node_modules
  - .next
  - dist
  - "*.pb.go"
  - "*.gen.go"

# Auto-fix settings
auto_fix: false

# Logging
verbose: false
log_level: info

# Local machines cannot build aarch64-darwin derivations (no darwin
# builder), so buildflow's nix steps that evaluate EVERY flake check
# system fail with platform-mismatch errors unrelated to code health.
# nix flake check (current system) stays enabled and remains the gate.
skip_steps:
  - nix-hash-fix
  - nix-build
  - nix-build-verify

# Experimental: per-rule finding suppression (validated below; remove if unsupported)
suppress:
  - rule: context_loss
    reason: "Cleanup paths deliberately log-not-return (primary error precedence), and validation errors must not embed field values (PII). Reviewed 2026-09-06."
  - rule: ignored
    reason: "The _, _ = pattern is deliberate best-effort HTTP writes and read-model scan closes where the primary error already surfaces. Reviewed 2026-09-06."
