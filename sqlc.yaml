version: "2"

sql:
  - name: "events"
    engine: "sqlite"
    schema: "sql/schema"
    queries: "sql/queries"
    strict_function_checks: true
    strict_order_by: true
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_exported_queries: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        emit_methods_with_db_argument: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_sql_as_comment: true
        json_tags_case_style: "camel"
        omit_unused_structs: true
        overrides:
          - db_type: "TEXT"
            go_type: "string"
            nullable: false
          - db_type: "DATETIME"
            go_type: "time.Time"
            nullable: true
          - db_type: "BOOLEAN"
            go_type: "bool"
          - db_type: "INTEGER"
            go_type: "int64"
          - db_type: "JSON"
            go_type: "encoding/json.RawMessage"
          - column: "events.id"
            go_type:
              import: "github.com/larsartmann/go-localsync/pkg/types"
              package: "types"
              type: "EventID"
          - column: "events.github_id"
            go_type:
              import: "github.com/larsartmann/go-localsync/pkg/types"
              package: "types"
              type: "GithubEventID"
        rename:
          id: "ID"
          github_id: "GithubID"
          url: "URL"
          api: "API"
          json: "JSON"
          created_at: "CreatedAt"
          updated_at: "UpdatedAt"
          synced_at: "SyncedAt"
