name: CI

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"
  # go-cqrs-lite v4 adopted encoding/json/v2, which Go 1.26 gates behind
  # this experiment until graduation. Without it every job fails with
  # "encoding/json/v2: build constraints exclude all Go files".
  GOEXPERIMENT: "jsonv2"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # -race requires cgo (the race runtime is built with it); the workflow
      # default CGO_ENABLED=0 is for the pure-Go cross-compile builds.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: coverage
          path: coverage.out

    timeout-minutes: 15
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          args: --timeout=5m

      # ADR-0004 architectural invariants (single aggregate, three fixed
      # events, projection guards) enforced on every push.
      - name: Run internal cqrs-lint (strict)
        run: go run ./cmd/cqrs-lint --strict

      # Library-side consumer lint (203 domain rules), error-gated: only
      # error-severity findings fail the build. Version-pinned so a new
      # upstream rule cannot break CI without a deliberate bump. Known
      # heuristic gaps are annotated inline via //cqrs-lint:ignore + reason.
      #
      # LOCAL-ONLY GATE for now: the pinned linter depends on the PRIVATE
      # larsartmann/go-finding module, which anonymous CI runners cannot
      # fetch. Run it from the devShell:
      #   go run github.com/larsartmann/go-cqrs-lite/cmd/cqrs-lint/v4@v4.8.1 ./pkg --min-severity error
      # To enable in CI: add an SSH_PRIVATE_KEY secret holding a deploy key
      # with read access to larsartmann/go-finding, then restore the step
      # with GOPRIVATE=github.com/larsartmann/go-finding + GIT_SSH_COMMAND.

    timeout-minutes: 15
  security:
    name: Security (govulncheck + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so gitleaks can scan the entire commit graph.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

        # gosec (SAST) already runs as part of the golangci-lint job above.
      - name: Run gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run govulncheck (dependency vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    timeout-minutes: 15
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify library compiles on ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ env.CGO_ENABLED }} \
            go build ./...

    timeout-minutes: 15
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
  provider:
    name: Provider module (provider/github)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: "1" # -race requires cgo
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: provider/github/go.mod
          cache: true
          cache-dependency-path: provider/github/go.sum

      - name: Build (standalone)
        working-directory: provider/github
        run: go build ./...

      - name: Test (standalone, race)
        working-directory: provider/github
        run: go test -race -count=1 ./...

    timeout-minutes: 15
