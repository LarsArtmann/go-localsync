name: CI

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"
  # go-cqrs-lite v4 adopted encoding/json/v2, which Go 1.26 gates behind
  # this experiment until graduation. Without it every job fails with
  # "encoding/json/v2: build constraints exclude all Go files".
  GOEXPERIMENT: "jsonv2"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # -race requires cgo (the race runtime is built with it); the workflow
      # default CGO_ENABLED=0 is for the pure-Go cross-compile builds.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: coverage
          path: coverage.out

    timeout-minutes: 15
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Step `if` cannot read the step's own env, so secret presence is
      # exposed at job level for the library cqrs-lint gate below.
      HAS_GO_FINDING_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      # Documentation-count truth: every drift incident in this repo's
      # history was a hand-copied number (test counts went 232 -> 437 -> 309
      # unnoticed). Fails CI when AGENTS/README/FEATURES claims drift from
      # code (per-package + totals) or the dependency table disagrees with
      # go.mod. `--coverage` adds the coverage-column check locally.
      - name: Check documented counts vs code
        run: ./scripts/check-doc-counts.sh

      # Workflow lint: catches schema errors, shellcheck issues and expression
      # mistakes in every .github/workflows/*.yml before a push ships them.
      # Version-pinned to match the actionlint in the nix devShell (1.7.12).
      - name: Run actionlint (workflow validation)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run golangci-lint
        id: golangci
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pinned to the exact version the nix devShell provides (golangci-lint
          # 2.13.2) so local and CI lint can never diverge on a fresh release.
          version: v2.13.2
          args: --timeout=5m

      # Formatting parity for the non-Go files dprint owns (json/yaml/md/
      # dockerfile). Version pinned to the devShell's dprint (0.56.1) so
      # local `dprint fmt` and CI `dprint check` agree on what is formatted.
      - name: Run dprint (formatting check)
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh -s 0.56.1
          "$HOME/.dprint/bin/dprint" check

      # ADR-0004 architectural invariants (single aggregate, three fixed
      # events, projection guards) enforced on every push.
      - name: Run internal localsync-lint (strict)
        id: localsync-lint
        run: go run ./cmd/localsync-lint --strict

      # Library-side consumer lint (203 domain rules), error-gated: only
      # error-severity findings fail the build. Version-pinned so a new
      # upstream rule cannot break CI without a deliberate bump. Known
      # heuristic gaps are annotated inline via //cqrs-lint:ignore + reason.
      #
      # The pinned linter depends on the PRIVATE larsartmann/go-finding
      # module. The step auto-enables once the SSH_PRIVATE_KEY secret (a
      # deploy key with read access to larsartmann/go-finding) is added to
      # the repo; until then it skips with a notice and the gate stays
      # local-only (run it from the devShell:
      #   go run github.com/larsartmann/go-cqrs-lite/cmd/cqrs-lint/v4@v4.8.1 ./pkg --min-severity error
      # ).
      - name: Run go-cqrs-lite cqrs-lint (error-gated)
        id: library-cqrs-lint
        if: env.HAS_GO_FINDING_KEY == 'true'
        env:
          GOPRIVATE: github.com/larsartmann/go-finding
          GIT_SSH_COMMAND: >-
            ssh -i $HOME/.ssh/go_finding_key
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/go_finding_key"
          chmod 600 "$HOME/.ssh/go_finding_key"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          go run github.com/larsartmann/go-cqrs-lite/cmd/cqrs-lint/v4@v4.8.1 ./pkg --min-severity error
          rc=$?
          git config --global --unset url."git@github.com:".insteadOf || true
          exit $rc

      - name: Library cqrs-lint skipped (missing SSH_PRIVATE_KEY)
        if: env.HAS_GO_FINDING_KEY != 'true'
        run: >-
          echo "::notice::go-cqrs-lite library lint skipped. Add the
          SSH_PRIVATE_KEY secret (deploy key with read access to
          larsartmann/go-finding) to enable this gate."

      # Gate badges in the run summary: one line, three statuses, visible
      # without opening a single step log (the 08:05 session's "master red
      # for 50 minutes unnoticed" failure mode). The library gate renders
      # its skip state here too, so the ::notice:: no longer depends on
      # someone reading the step log to be seen.
      - name: Summarize static-analysis gates
        if: always()
        run: |
          badge() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⚪ skipped" ;;
              *) echo "❔ $1" ;;
            esac
          }
          {
            echo "### Static-analysis gates"
            echo ""
            echo "| Gate | Status |"
            echo "| --- | --- |"
            echo "| golangci-lint | $(badge "${{ steps.golangci.outcome }}") |"
            echo "| localsync-lint (ADR-0004, strict) | $(badge "${{ steps.localsync-lint.outcome }}") |"
            echo "| library cqrs-lint (error-gated) | $(badge "${{ steps.library-cqrs-lint.outcome }}") |"
            echo ""
            echo "Library cqrs-lint runs only when the SSH_PRIVATE_KEY secret exists; skipped means the gate is local-only (run it from the devShell)."
          } >> "$GITHUB_STEP_SUMMARY"

    timeout-minutes: 15
  security:
    name: Security (govulncheck + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so gitleaks can scan the entire commit graph.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

        # gosec (SAST) already runs as part of the golangci-lint job above.
      - name: Run gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run govulncheck (dependency vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    timeout-minutes: 15
  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Fail fast with the fix spelled out when go.mod/go.sum moved without a
      # vendorHash re-pin, instead of surfacing a cryptic hash mismatch after
      # a full nix build (or worse, not surfacing at all pre-nix-job).
      - name: Guard vendorHash drift
        env:
          # PRs diff against the base branch; pushes against the previous sha.
          # New branches / force-pushes skip (nix flake check remains the gate).
          VENDORHASH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: ./scripts/check-vendorhash.sh "$VENDORHASH_BASE"

      # The nix build was silently red for over an hour on 2026-09-05
      # (vendorHash drift after a dependency refresh) because no CI job ran
      # it. This gate makes that failure loud: the flake must evaluate,
      # build, and pass its checks (incl. the cqrs-lint architectural gate)
      # on every push.
      #
      # The flake's go-nix-helpers input uses an SSH URL (works locally with
      # a loaded SSH key); CI overrides it to anonymous HTTPS since the repo
      # is public. Owner decision tracked in TODO_LIST.md: make go-finding
      # public vs keep the SSH_PRIVATE_KEY secret for the library lint gate.
      - name: Run nix flake check
        env:
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: nix flake check --override-input go-nix-helpers "github:LarsArtmann/go-nix-helpers/master"

    timeout-minutes: 30
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test, lint, security, nix]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
          # arm64 windows is a niche target; amd64 proves the compile surface
          # (modernc.org/sqlite is pure Go, so CGO is not a constraint).
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify library compiles on ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ env.CGO_ENABLED }} \
            go build ./...

    timeout-minutes: 15
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
  provider:
    name: Provider module (provider/github)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      CGO_ENABLED: "1" # -race requires cgo
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: provider/github/go.mod
          cache: true
          cache-dependency-path: provider/github/go.sum

      - name: Build (standalone)
        working-directory: provider/github
        run: go build ./...

      # Lint parity for the nested module: pinned to the same golangci-lint
      # version as the root lint job (v2.13.2, the devShell version) and run
      # via `go run` like the actionlint step — no action-input guessing, no
      # floating latest. The module carries its own .golangci.yml (scoped
      # linter set; also stops config discovery from walking up to the root
      # config, which would apply core-library exclusions to provider paths).
      - name: Run golangci-lint (standalone, pinned)
        working-directory: provider/github
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./... --timeout=5m

      - name: Test (standalone, race)
        working-directory: provider/github
        run: go test -race -count=1 ./...

    timeout-minutes: 15
